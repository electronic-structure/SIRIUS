name: Build

on:
  push:
    branches: ['master', 'develop']
  pull_request:
    branches: ['master', 'develop']

jobs:

  build_and_test_cpu:
    runs-on: ubuntu-latest
    container: electronicstructure/sirius:latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache spack buildcache
        uses: actions/cache@v4
        with:
          path: .spack-buildcache
          key: spack-buildcache-cpu-${{ hashFiles('spack_repo/sirius_repo/packages/**', 'ci/github-ci/Dockerfile') }}
          restore-keys: spack-buildcache-cpu-
      - name: Build SIRIUS
        run: |
          install -d -m 755 "${RUNNER_TEMP}/sirius-stage"
          spack -e /sirius-env config add "config:build_stage:${RUNNER_TEMP}/sirius-stage"
          spack -e /sirius-env repo add ${GITHUB_WORKSPACE}/spack_repo/sirius_repo
          spack -e /sirius-env mirror add --unsigned --autopush local-buildcache file://${GITHUB_WORKSPACE}/.spack-buildcache
          spack -e /sirius-env develop -p ${GITHUB_WORKSPACE} sirius@develop
          spack -e /sirius-env concretize -f
          spack -e /sirius-env install
      - name: Run unit tests
        run: |
          build_dir=$(spack -e /sirius-env location -b sirius)
          chown -R nobody:nogroup "${RUNNER_TEMP}/sirius-stage"
          cd "$build_dir"
          spack -e /sirius-env --color always build-env sirius -- runuser -u nobody -- \
            env HOME="$build_dir" ctest --output-on-failure --label-exclude integration_test
      - name: Run verification tests
        run: |
          cd $(spack -e /sirius-env location -b sirius)
          spack -e /sirius-env --color always build-env sirius -- ctest --output-on-failure -L cpu_serial
      - name: Build QE
        run: |
          cd ${GITHUB_WORKSPACE}
          git clone --depth 1 https://github.com/electronic-structure/q-e-sirius.git
          cd q-e-sirius
          mkdir build
          cd build
          eval $(spack -e /sirius-env load --sh cmake)
          eval $(spack -e /sirius-env load --sh sirius)
          cmake .. -DQE_ENABLE_SIRIUS=1
          make
  build_and_test_clang:
    runs-on: ubuntu-latest
    container: electronicstructure/sirius:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build SIRIUS
        run: |
          spack -e /sirius-env-clang develop -p ${GITHUB_WORKSPACE} sirius@develop~openmp
          spack -e /sirius-env-clang concretize -f
          spack -e /sirius-env-clang install
