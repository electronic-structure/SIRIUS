gcc-env:
  compiler:
      - toolchain: gcc
        spec: gcc
  mpi:
      spec: cray-mpich@8.1.30
  unify: when_possible
  specs:
  - sirius@develop +python +vdwxc +apps +tests +scalapack +nlcglib
  - sirius@develop +elpa
  - nlcglib@1.0b
  variants:
  - +mpi
  views:
    sirius:
      link: roots
      uenv:
        add_compilers: true
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]
