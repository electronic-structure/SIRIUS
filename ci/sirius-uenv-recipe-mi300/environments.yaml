gcc-env:
  compiler: [gcc]
  network:
      mpi: cray-mpich@8.1.32+rocm
  unify: when_possible
  specs:
  - sirius@develop ~python +vdwxc +apps +tests +dlaf +scalapack +rocm
  - sirius@develop +elpa
  - nlcglib@1.3.0
  variants:
  - amdgpu_target=gfx942
  - amdgpu_target_sram_ecc=gfx942
  views:
    sirius:
      link: roots
      uenv:
        add_compilers: true
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]
