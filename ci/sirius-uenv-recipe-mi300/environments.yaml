gcc-env:
  compiler:
      - toolchain: gcc
        spec: gcc
  mpi:
      spec: cray-mpich@8.1.30
      gpu: rocm
  unify: when_possible
  specs:
  - sirius@develop ~python +vdwxc +apps +tests +dlaf +scalapack +rocm
  - sirius@develop +elpa
  variants:
  - amdgpu_target=gfx942
  - amdgpu_target_sram_ecc=gfx942
  views:
    sirius:
      link: roots
      uenv:
        add_compilers: true
        prefix_paths:
          LD_LIBRARY_PATH: [lib, lib64]
